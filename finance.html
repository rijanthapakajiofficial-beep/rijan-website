<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>My Finance</title>
<meta name="description" content="Private personal finance app."/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#07090d" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)"/>
<meta name="color-scheme" content="dark light"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Finance"/>
<link rel="manifest" href="/finance.webmanifest"/>
<link rel="icon" type="image/png" sizes="32x32" href="/finance-favicon-32.png"/>
<link rel="apple-touch-icon" href="/finance-icon-180.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#07090d;--surface:#0d1118;--card:#121823;--card2:#18202d;--line:rgba(255,255,255,.07);
  --text:#eef0f3;--text2:#b4bac6;--muted:#7d8696;--gold:#c9a96e;--gold2:#e4c993;--gold-dim:rgba(201,169,110,.14);
  --up:#6fcf97;--down:#f27d7d;--shadow:0 10px 30px rgba(0,0,0,.45);--r:20px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root{
  --bg:#f6f3ee;--surface:#ffffff;--card:#ffffff;--card2:#f1ece3;--line:rgba(20,20,20,.09);
  --text:#1b1c1f;--text2:#44474f;--muted:#6f7480;--gold:#8b6a2f;--gold2:#a8803a;--gold-dim:rgba(139,106,47,.12);
  --up:#1f8a4c;--down:#c43d3d;--shadow:0 10px 30px rgba(40,30,10,.12);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;}
body{min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;}
input,select,textarea{font:inherit;color:var(--text);}
.amt,.big,.num{font-variant-numeric:tabular-nums;}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(var(--safe-t) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.top h1{flex:1;margin:0;font-size:1.25rem;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--text2);}
.ib:active{background:var(--card);}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px var(--card);}
.dot.ok{background:var(--up);}.dot.warn{background:#e6b450;}.dot.err{background:var(--down);}
main{padding:4px 16px calc(var(--safe-b) + 112px);}
h2{font-size:.8rem;margin:0;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.h-row{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;}
.h-row a,.link{color:var(--gold);font-size:.85rem;font-weight:500;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 16px;margin-bottom:6px;background:radial-gradient(120% 90% at 85% -10%,var(--gold-dim),transparent 60%),linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:var(--shadow);}
.lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.big{font-size:clamp(2rem,10vw,2.7rem);font-weight:650;line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em;}
.delta{font-size:.85rem;color:var(--text2);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;}
.up{color:var(--up);}.down{color:var(--down);}.flat{color:var(--text2);}
.chips{display:flex;gap:8px;}
.chips.scroll{overflow-x:auto;scrollbar-width:none;padding:2px 0;margin:0 -2px;}
.chips.scroll::-webkit-scrollbar{display:none;}
.chips.wrap{flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--text2);white-space:nowrap;font-size:.88rem;}
.chip.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold2);}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);min-width:112px;}
.mini b{font-weight:600;font-size:.92rem;}
.mini span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.spark{display:block;width:100%;height:64px;margin:10px 0 12px;}
.acct-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;}
.acct-scroll::-webkit-scrollbar{display:none;}
.acct{flex:0 0 150px;scroll-snap-align:start;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);}
.acct .ic{width:34px;height:34px;border-radius:11px;background:var(--gold-dim);color:var(--gold);display:grid;place-items:center;margin-bottom:12px;}
.acct b{display:block;font-size:1.02rem;font-weight:600;margin-top:2px;}
.acct small{color:var(--text2);font-size:.8rem;}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.trio div span{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.trio div b{font-size:1rem;font-weight:600;}
.split{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;display:flex;margin-top:14px;}
.split i{display:block;height:100%;}
.pill{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--gold-dim);color:var(--gold2);}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;min-height:64px;width:100%;text-align:left;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.av{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.2rem;flex:none;border:1px solid var(--line);}
.row .t{flex:1;min-width:0;}
.row .t b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .t small{display:block;color:var(--text2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r{text-align:right;font-weight:600;white-space:nowrap;}
.row .r small{display:block;font-weight:400;color:var(--text2);font-size:.78rem;}
.day{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:18px 4px 4px;}
.bar{margin:10px 0;}
.bar .tp{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px;gap:8px;}
.track{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
.monthbar b{font-size:1.05rem;font-weight:600;}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:.9rem;}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:10px;}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface);margin:12px 0;}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--text2);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;}
.badge{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--text2);margin-left:6px;vertical-align:middle;}
.list-link{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;min-height:60px;text-align:left;border-bottom:1px solid var(--line);}
.list-link:last-child{border-bottom:0;}
.list-link .ic{width:40px;height:40px;border-radius:13px;background:var(--gold-dim);color:var(--gold);display:grid;place-items:center;flex:none;}
.list-link .t{flex:1;}.list-link .t b{display:block;font-weight:550;}.list-link .t small{color:var(--text2);font-size:.82rem;}
.list-link .chev{color:var(--muted);}
.switch{width:50px;height:30px;border-radius:99px;background:var(--surface);border:1px solid var(--line);position:relative;flex:none;transition:background .2s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text2);transition:transform .2s,background .2s;}
.switch[aria-checked="true"]{background:var(--gold-dim);border-color:var(--gold);}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--gold);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14110a;font-weight:650;font-size:1rem;}
.btn:active{filter:brightness(.92);}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold2);}
.btn.sub{background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:550;}
.btn.danger{background:transparent;border:1px solid var(--down);color:var(--down);}
.btn[disabled]{opacity:.5;}
.btn-row{display:flex;gap:10px;margin-top:10px;}.btn-row .btn{flex:1;}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;padding:8px 8px calc(var(--safe-b) + 8px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;color:var(--muted);font-size:.7rem;font-weight:550;border-radius:14px;}
.tab.on{color:var(--gold2);}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;margin-top:-26px;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold2),var(--gold));color:#14110a;box-shadow:0 8px 24px rgba(201,169,110,.35),0 0 0 6px var(--surface);}
.fab:active{transform:scale(.95);}
.fab svg{width:28px;height:28px;stroke-width:2.4;}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:100%;max-width:520px;max-height:92dvh;z-index:51;display:flex;flex-direction:column;background:var(--card);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow);transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.sheet.show{transform:translate(-50%,0);}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0;flex:none;}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 20px;flex:none;}
.sheet header h3{margin:0;font-size:1.1rem;font-weight:650;}
.sheet .body{min-height:0;flex:1 1 auto;overflow-y:auto;padding:6px 20px 12px;-webkit-overflow-scrolling:touch;}
.sheet footer{padding:10px 20px calc(var(--safe-b) + 16px);flex:none;border-top:1px solid var(--line);background:var(--card);}
.body label{display:block;font-size:.78rem;color:var(--text2);margin:14px 0 6px;font-weight:550;}
.body .lbl{margin:14px 0 6px;}
.body input:not([type=checkbox]),.body select,.body textarea{width:100%;min-height:50px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:16px;}
.body textarea{padding:12px 14px;min-height:120px;}
.body input:focus,.body textarea:focus,.body select:focus{outline:2px solid var(--gold);outline-offset:1px;}
.body .check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.85rem;margin-top:16px;}
.body .check input{width:22px;height:22px;min-height:0;flex:none;margin:0;accent-color:var(--gold);}
.amtbox{display:flex !important;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin:14px 0 0 !important;}
.amtbox span{color:var(--muted);font-weight:650;}
.amtbox input{border:0 !important;background:transparent !important;font-size:2rem !important;font-weight:650;min-height:62px !important;padding:0 !important;outline:none !important;}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin-top:6px;}
.seg button{min-height:42px;border-radius:11px;color:var(--text2);font-weight:550;font-size:.9rem;}
.seg button.on{background:var(--card2);color:var(--gold2);box-shadow:0 1px 6px rgba(0,0,0,.25);}
.err{color:var(--down);font-size:.85rem;min-height:1.2em;margin-top:10px;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.kv span{color:var(--text2);}.kv b{font-weight:550;text-align:right;}
.bigamt{font-size:2.2rem;font-weight:650;text-align:center;margin:10px 0 6px;}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 98px);transform:translate(-50%,20px);z-index:80;max-width:min(92vw,480px);display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--card2);border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;font-size:.9rem;}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{color:var(--gold2);font-weight:650;}
.dlg{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(0,0,0,.6);padding:24px;}
.dlg.show{display:grid;}
.dlg .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);}
.dlg h4{margin:0 0 8px;font-size:1.1rem;}.dlg p{margin:0 0 18px;color:var(--text2);}
.full{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;overflow-y:auto;padding:calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);}
.full.show{display:block;}
.full .in{max-width:380px;margin:0 auto;min-height:calc(100dvh - 48px);display:flex;flex-direction:column;justify-content:center;}
.logo{width:76px;height:76px;border-radius:22px;margin:0 auto 18px;display:block;}
.full h1{text-align:center;margin:0 0 6px;font-size:1.6rem;}.full .sub{text-align:center;color:var(--text2);margin:0 0 26px;}
.full input{width:100%;min-height:54px;padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:16px;margin-bottom:12px;}
.full input:focus{outline:2px solid var(--gold);}
.dots{display:flex;justify-content:center;gap:16px;margin:8px 0 26px;min-height:16px;}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);}.dots i.f{background:var(--gold);border-color:var(--gold);}
.dots.shake{animation:shake .35s;}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto;}
.pad button{height:68px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.6rem;font-weight:500;display:grid;place-items:center;}
.pad button:active{background:var(--gold-dim);}
.pad .ghost{background:transparent;border-color:transparent;font-size:.9rem;color:var(--text2);}
.hide .amt,.hide .big,.hide .bigamt{filter:blur(9px);user-select:none;}
.hide svg.spark,.hide svg.bars{filter:blur(8px);}
.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
@media (min-width:560px){body{background:radial-gradient(circle at 50% 0,var(--card2),var(--bg) 60%);}#app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg);}}
</style>
</head>
<body>
<noscript>This app needs JavaScript.</noscript>
<div id="app">
  <header class="top">
    <button class="ib hidden" id="back" data-act="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 id="title">My Finance</h1>
    <button class="ib" data-act="syncInfo" aria-label="Sync status"><span class="dot" id="syncDot"></span></button>
    <button class="ib" data-act="toggleHide" id="eyeBtn" aria-label="Hide amounts"></button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-route="home" id="t-home"></button>
    <button class="tab" data-route="activity" id="t-activity"></button>
    <button class="fab" data-act="add" aria-label="Add transaction"></button>
    <button class="tab" data-route="invest" id="t-invest"></button>
    <button class="tab" data-route="more" id="t-more"></button>
  </nav>
</div>
<div class="overlay" id="overlay" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <header><h3 id="shTitle"></h3><button class="ib" data-act="closeSheet" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body" id="shBody"></div>
  <footer id="shFoot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dlg" id="dlg"><div class="box"><h4 id="dlgT"></h4><p id="dlgM"></p><div class="btn-row"><button class="btn sub" id="dlgNo">Cancel</button><button class="btn" id="dlgYes">OK</button></div></div></div>

<div class="full" id="login">
  <div class="in">
    <img class="logo" src="/finance-icon-192.png" alt="" width="76" height="76"/>
    <h1>My Finance</h1><p class="sub">Sign in to sync across your devices</p>
    <input id="lgEmail" type="email" placeholder="Email" autocomplete="username" inputmode="email"/>
    <input id="lgPass" type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn" data-act="signIn">Sign in</button>
    <button class="btn sub" style="margin-top:10px" data-act="localOnly">Use on this device only</button>
    <p class="note" style="text-align:center">On-device mode keeps data only in this browser. Clearing browser data erases it.</p>
  </div>
</div>
<div class="full" id="lock">
  <div class="in">
    <img class="logo" src="/finance-icon-192.png" alt="" width="76" height="76"/>
    <h1>Enter PIN</h1><p class="sub" id="lockMsg">Your finance is locked</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <button class="link" style="margin:22px auto 0;display:block" data-act="forgotPin">Forgot PIN?</button>
  </div>
</div>

  expense:['Food','Transport','Mobile / Data','Bills','Rent','Shopping','Health','Education','Entertainment','Investment','Other']};

/* ═════════ helpers ═════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const rnd=n=>Math.round((Number(n)||0)*100)/100;
const m=(n,sign)=>{n=rnd(n);return `<span class="amt">${sign&&n>0?'+':''}${n<0?'−':''}NPR ${num(Math.abs(n))}</span>`;};
const parse=v=>parseFloat(String(v==null?'':v).replace(/,/g,''));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const ymOf=s=>String(s).slice(0,7);
const shiftYM=(ym,n)=>{const p=ym.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad2(d.getMonth()+1);};
const mLabel=ym=>{const p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'});};
const mShort=ym=>{const p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-GB',{month:'short'});};
const dayLabel=d=>{const t=today();if(d===t)return 'Today';const y=new Date();y.setDate(y.getDate()-1);if(d===y.getFullYear()+'-'+pad2(y.getMonth()+1)+'-'+pad2(y.getDate()))return 'Yesterday';const p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}};
const v=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const emoji=c=>EMOJI[c]||(/^Lent|Borrowed|Repaid/.test(c)?'🤝':'🏷️');
const accIcon=t=>ico(t==='bank'?'bank':t==='wallet'?'wallet':'cash');

/* ═════════ state ═════════ */
const S={d:{accounts:[],ledger:[],holdings:[],goals:[],items:[],snaps:[],loans:[],settings:{sipSym:'',sipAmount:0,sipDay:1}},
  route:'home',month:null,filter:'',hide:false,auth:false,localOnly:false,ready:false,locked:false,sheetOpen:false,sync:'local',email:'',dirty:{},sb:null,hiddenAt:0,installEvt:null};
const sbOK=()=>!!(S.sb&&S.auth);

/* ═════════ storage + sync ═════════ */
function loadLocal(){
  S.month=today().slice(0,7);
  KEYS.forEach(k=>{try{const x=JSON.parse(localStorage.getItem('fx2_'+k)||'null');if(x!==null)S.d[k]=x;}catch(e){}});
  try{S.dirty=JSON.parse(localStorage.getItem('fx_dirty')||'{}')||{};}catch(e){S.dirty={};}
  S.hide=localStorage.getItem('fx_hide')==='1';S.localOnly=localStorage.getItem('fx_localonly')==='1';
}
function setSync(st){S.sync=st;const d=$('#syncDot');d.className='dot '+({synced:'ok',pending:'warn',error:'err',local:''}[st]||'');}
function persistDirty(){try{localStorage.setItem('fx_dirty',JSON.stringify(S.dirty));}catch(e){}}
async function push(k){
  const r=await S.sb.from('finance_data').upsert({category:k,data:S.d[k],updated_at:new Date().toISOString()},{onConflict:'category'});
  if(r.error)throw r.error;
  delete S.dirty[k];persistDirty();
}
async function save(k){
  try{localStorage.setItem('fx2_'+k,JSON.stringify(S.d[k]));}catch(e){}
  if(!sbOK()){setSync(S.localOnly||!S.sb?'local':'pending');return;}
  S.dirty[k]=1;persistDirty();setSync('pending');
  if(!navigator.onLine)return;
  try{await push(k);if(!Object.keys(S.dirty).length)setSync('synced');}
  catch(e){setSync('error');}
}
async function flush(){if(!sbOK()||!navigator.onLine)return;try{for(const k of Object.keys(S.dirty))await push(k);setSync('synced');}catch(e){setSync('error');}}
const meaningful=x=>Array.isArray(x)?x.length>0:!!(x&&(x.seeded||x.sipSym));
async function pull(){
  if(!sbOK())return false;
  setSync('pending');
  try{
    const r=await S.sb.from('finance_data').select('category,data');
    if(r.error)throw r.error;
    const remote={};(r.data||[]).forEach(x=>{if(x.data!=null)remote[x.category]=x.data;});
    for(const k of KEYS){
      if(S.dirty[k]){await push(k);}
      else if(remote[k]!==undefined){S.d[k]=remote[k];try{localStorage.setItem('fx2_'+k,JSON.stringify(remote[k]));}catch(e){}}
      else if(meaningful(S.d[k])){await push(k);}
    }
    setSync('synced');return true;
  }catch(e){setSync('error');return false;}
}
function seed(){
  const d=S.d;if(d.settings.seeded||d.accounts.length||d.holdings.length||d.ledger.length||d.loans.length)return;
  const base=uid();let i=0;const id=()=>base+(i++);
  d.accounts=[['Siddhartha Bank','bank'],['Prabhu Bank','bank'],['NIMB Mega Bank','bank'],['eSewa','wallet'],['Khalti by IME','wallet'],['Cash in hand','cash']].map(a=>({id:id(),name:a[0],type:a[1],opening:0}));
  const day=today(),h=(sym,name,units,avg,price)=>({id:id(),sym,name,units,avg,price,priceDate:day});
  d.holdings=[h('MSIP','Mero Microfinance',100,11.56,11.74),h('NSY','Nabil Samriddhi Fund',100,9.33,9.04),h('PSIS','Prabhu Smart Fund',100,10.49,12.05),h('SSIS','Siddhartha Investment Scheme',1030,11.01,11.09),h('SYPNL','Sanima Equity Fund',10,1424,1273.8),h('VLBS','Vijaya Laghubitta',1,706,628)];
  d.settings=Object.assign({},d.settings,{sipSym:'SSIS',sipAmount:1000,sipDay:1,seeded:true});
  ['accounts','holdings','settings'].forEach(save);
}

/* ═════════ calculations ═════════ */
const acctById=id=>S.d.accounts.find(a=>a.id===Number(id));
const txAcct=t=>{const a=acctById(t.acct);return a?a.id:(S.d.accounts[0]?S.d.accounts[0].id:null);};
const acctName=id=>{const a=acctById(id);return a?a.name:'Unknown';};
function loanPaid(l){return S.d.ledger.filter(t=>t.loan===l.id&&t.kind==='repay').reduce((a,t)=>a+(+t.amount||0),0);}
function loanOut(l){return l.writtenOff?0:Math.max(0,rnd((+l.amount||0)-loanPaid(l)));}
function balances(){
  const b={};S.d.accounts.forEach(a=>{b[a.id]=+a.opening||0;});
  S.d.ledger.forEach(t=>{const a=+t.amount||0,f=txAcct(t);if(f==null)return;
    if(t.type==='income')b[f]+=a;else if(t.type==='expense')b[f]-=a;
    else if(t.type==='transfer'){b[f]-=a;if(b[t.to]!==undefined)b[t.to]+=a;}
    else if(t.type==='loan')b[f]+=(t.flow==='in'?a:-a);});
  return b;
}
function calc(){
  const d=S.d,bal=balances(),cash=Object.values(bal).reduce((a,x)=>a+x,0);
  let inv=0,cost=0;d.holdings.forEach(h=>{inv+=(+h.units||0)*(+h.price||0);cost+=(+h.units||0)*(+h.avg||0);});
  let assets=0,debts=0;d.items.forEach(i=>{if(i.kind==='debt')debts+=+i.value||0;else assets+=+i.value||0;});
  let recv=0,pay=0;d.loans.forEach(l=>{const o=loanOut(l);if(l.dir==='borrowed')pay+=o;else recv+=o;});
  return {cash,bal,inv,cost,pnl:inv-cost,assets,debts,recv,pay,nw:rnd(cash+inv+assets+recv-debts-pay)};
}
function monthStats(ym,acct){
  let inc=0,exp=0;
  S.d.ledger.forEach(t=>{if(t.type==='transfer'||t.type==='loan'||ymOf(t.date)!==ym)return;if(acct&&txAcct(t)!==Number(acct))return;const a=+t.amount||0;if(t.type==='income')inc+=a;else exp+=a;});
  return {inc,exp,net:inc-exp,rate:inc>0?(inc-exp)/inc:null};
}
const hasData=()=>S.d.ledger.length||S.d.loans.length||S.d.items.length||S.d.holdings.length||S.d.accounts.some(a=>+a.opening);
function snapshot(){
  if(!hasData())return;
  const ym=today().slice(0,7),nw=calc().nw,s=S.d.snaps,i=s.findIndex(x=>x.ym===ym);
  if(i>=0){if(s[i].nw===nw)return;s[i].nw=nw;}else s.push({ym,nw});
  s.sort((a,b)=>a.ym<b.ym?-1:1);save('snaps');
}
const sipDone=ym=>S.d.ledger.some(t=>t.sip&&ymOf(t.date)===ym);
function upcoming(){
  const out=[],t0=today(),s=S.d.settings;
  if(+s.sipAmount>0&&s.sipSym){const day=Math.min(28,Math.max(1,+s.sipDay||1));const ym=sipDone(t0.slice(0,7))?shiftYM(t0.slice(0,7),1):t0.slice(0,7);out.push({date:ym+'-'+pad2(day),label:s.sipSym+' SIP',amt:+s.sipAmount,tag:'monthly',em:'📈'});}
  S.d.goals.forEach(g=>{if(g.deadline&&(+g.saved||0)<(+g.target||0))out.push({date:g.deadline,label:g.name,amt:(+g.target)-(+g.saved||0),tag:'still needed',em:'🎯'});});
  S.d.loans.forEach(l=>{const o=loanOut(l);if(l.due&&o>0)out.push({date:l.due,label:(l.dir==='borrowed'?'Repay ':'Collect from ')+l.person,amt:o,tag:l.dir==='borrowed'?'you owe':'owed to you',em:'🤝'});});
  return out.sort((a,b)=>a.date<b.date?-1:1).slice(0,5).map(o=>Object.assign(o,{days:dayDiff(o.date,t0)}));
}

/* ═════════ small ui bits ═════════ */
function gain(n,pct){if(!n)return '<span class="flat">– 0</span>';const u=n>0;return `<span class="${u?'up':'down'}">${u?'▲':'▼'} ${m(Math.abs(n))}${pct==null?'':' · '+(pct>0?'+':'')+(pct*100).toFixed(1)+'%'}</span>`;}
function txAmt(t){
  if(t.type==='income')return `<span class="up">${m(t.amount,true)}</span>`;
  if(t.type==='expense')return m(-t.amount);
  if(t.type==='loan')return `<span class="flat">${m(t.flow==='in'?t.amount:-t.amount,true)}</span>`;
  return `<span class="flat">${m(t.amount)}</span>`;
}
function txTitle(t){return t.type==='transfer'?'Transfer':t.category;}
function txSub(t){const who=t.type==='transfer'?acctName(t.acct)+' → '+acctName(t.to):acctName(txAcct(t));return esc(who)+(t.note?' · '+esc(t.note):'');}
function txRow(t){return `<button class="row" data-act="txOpen" data-id="${t.id}"><span class="av">${t.type==='transfer'?'🔁':emoji(t.category)}</span><span class="t"><b>${esc(txTitle(t))}</b><small>${txSub(t)}</small></span><span class="r">${txAmt(t)}</span></button>`;}
function sparkSvg(snaps){
  if(snaps.length<2)return '';
  const w=300,h=64,p=4,vals=snaps.map(s=>s.nw),mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=snaps.map((s,i)=>[p+i*(w-2*p)/(snaps.length-1),h-p-(s.nw-mn)/rg*(h-2*p)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' '),last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Net worth trend"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs><path d="${line} L${last[0]} ${h} L${pts[0][0]} ${h}Z" fill="url(#sg)"/><path d="${line}" fill="none" stroke="var(--gold2)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function barsSvg(){
  const ym=today().slice(0,7),ms=[];for(let i=5;i>=0;i--)ms.push(shiftYM(ym,-i));
  const st=ms.map(x=>monthStats(x)),mx=Math.max(1,...st.map(s=>Math.max(s.inc,s.exp)));
  if(!st.some(s=>s.inc||s.exp))return '';
  const w=300,h=120,bw=15,gap=(w-6*2*bw)/7;
  const g=st.map((s,i)=>{const x=gap+i*(2*bw+gap),hi=s.inc/mx*84,he=s.exp/mx*84;
    return `<rect x="${x}" y="${96-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--up)" opacity=".85"/><rect x="${x+bw+1}" y="${96-he}" width="${bw}" height="${he}" rx="4" fill="var(--down)" opacity=".85"/><text x="${x+bw}" y="114" text-anchor="middle" font-size="10" fill="var(--muted)">${mShort(ms[i])}</text>`;}).join('');
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Income and expense, last 6 months">${g}</svg>`;
}

/* ═════════ views ═════════ */
const TITLES={home:'My Finance',activity:'Activity',invest:'Investments',more:'More','more/accounts':'Accounts','more/loans':'Lend & borrow','more/goals':'Goals','more/items':'Assets & debts'};

  <div class="h-row"><h2>Recent</h2><a href="#/activity">See all</a></div>
  <div class="card" style="padding:6px 14px">${recent.length?recent.map(txRow).join(''):'<div class="empty">Nothing logged yet.<br/>Tap the + button to add your first transaction.</div>'}</div>`;

function viewActivity(){
  const ym=S.month,acct=S.filter,ms=monthStats(ym,acct||null);
  const rows=S.d.ledger.filter(t=>ymOf(t.date)===ym&&(!acct||txAcct(t)===Number(acct)||t.to===Number(acct))).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id);
  const by={};rows.forEach(t=>{if(t.type==='expense')by[t.category]=(by[t.category]||0)+(+t.amount||0);});
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=cats.length?cats[0][1]:1,tot=ms.exp||1;

  rows.forEach(t=>{if(t.date!==cur){flushDay();cur=t.date;}buf.push(txRow(t));if(t.type==='income')net+=+t.amount;else if(t.type==='expense')net-=+t.amount;});flushDay();
  return `<div class="monthbar"><button class="ib" data-act="monthPrev" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>${mLabel(ym)}</b><button class="ib" data-act="monthNext" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="chips scroll" style="margin-bottom:12px"><button class="chip ${acct?'':'on'}" data-act="filter" data-id="">All accounts</button>${S.d.accounts.map(a=>`<button class="chip ${String(a.id)===String(acct)?'on':''}" data-act="filter" data-id="${a.id}">${esc(a.name)}</button>`).join('')}</div>
  <div class="card"><div class="trio"><div><span>Income</span><b class="up">${m(ms.inc)}</b></div><div><span>Spent</span><b>${m(ms.exp)}</b></div><div><span>Net</span><b>${m(ms.net,true)}</b></div></div></div>
  ${cats.length?`<div class="h-row"><h2>Where it went</h2></div><div class="card">${cats.map(c=>`<div class="bar"><div class="tp"><span>${emoji(c[0])} ${esc(c[0])}</span><span>${m(c[1])} <small class="flat">${Math.round(c[1]/tot*100)}%</small></span></div><div class="track"><div class="fill" style="width:${(c[1]/mx*100).toFixed(1)}%"></div></div></div>`).join('')}</div>`:''}
  ${list||'<div class="empty">No transactions in '+mLabel(ym)+'.</div>'}`;

function viewInvest(){
  const c=calc(),H=S.d.holdings,s=S.d.settings,t0=today().slice(0,7);
  const vals=H.map(h=>({sym:h.sym,v:(+h.units||0)*(+h.price||0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),tot=vals.reduce((a,x)=>a+x.v,0);

/* ── transaction sheet ── */
function acctChips(label,id,sel){return `<div class="lbl">${label}</div><div class="chips scroll">${S.d.accounts.map(a=>`<button class="chip ${a.id===sel?'on':''}" data-act="pick" data-input="${id}" data-v="${a.id}">${accIcon(a.type)} ${esc(a.name)}</button>`).join('')}</div><input type="hidden" id="${id}" value="${sel}"/>`;}
function catList(type){const used={};S.d.ledger.filter(t=>t.type===type).forEach(t=>used[t.category]=(used[t.category]||0)+1);const base=CATS[type];return base.slice().sort((a,b)=>(used[b]||0)-(used[a]||0)).concat(Object.keys(used).filter(c=>!base.includes(c)).sort((a,b)=>used[b]-used[a])).slice(0,14);}
function openTxn(type,d){
  d=d||{};if(!S.d.accounts.length){toast('Add an account first');go('more/accounts');return;}
  const last=localStorage.getItem('fx_lastacct'),def=(S.d.accounts.find(a=>String(a.id)===last)||S.d.accounts[0]).id;
  const acct=d.acct||def,to=d.to||(S.d.accounts.find(a=>a.id!==acct)||S.d.accounts[0]).id;
  const seg=['expense','income','move'].map(t=>`<button class="${t===type?'on':''}" data-act="txType" data-v="${t}">${{expense:'Expense',income:'Income',move:'Move'}[t]}</button>`).join('');
  const mid=type==='move'?acctChips('From','fFrom',acct)+acctChips('To','fTo',to):acctChips(type==='income'?'Into account':'Paid from','fAcct',acct)+`<label for="fCat">Category</label><input id="fCat" maxlength="30" autocomplete="off" value="${esc(d.cat||'')}" placeholder="Pick or type"/><div class="chips wrap" style="margin-top:10px">${catList(type).map(c=>`<button class="chip ${c===d.cat?'on':''}" data-act="pickCat" data-v="${esc(c)}">${emoji(c)} ${esc(c)}</button>`).join('')}</div>`;
  openSheet(type==='move'?'Move money':type==='income'?'Add income':'Add expense',
   `<div class="seg" role="tablist">${seg}</div><label class="amtbox"><span>NPR</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(d.amt||'')}" autofocus/></label>${mid}<label for="fDate">Date</label><input type="date" id="fDate" value="${d.date||today()}"/><label for="fNote">${type==='move'?'Note':'What was it for?'} (optional)</label><input id="fNote" maxlength="120" value="${esc(d.note||'')}" placeholder="${type==='expense'?'Momo with friends…':''}"/><div class="err" id="shErr" role="alert"></div>`,
   `<button class="btn" data-act="txSave" data-type="${type}">Save</button>`);
}
function saveTxn(type){
  const amt=parse(v('fAmt'));if(!(amt>0))return err('Enter an amount above 0');
  const date=v('fDate')||today(),note=v('fNote');
  if(type==='move'){const f=Number(v('fFrom')),t=Number(v('fTo'));if(!f||!t||f===t)return err('Pick two different accounts');
    const id=uid();S.d.ledger.push({id,type:'transfer',acct:f,to:t,amount:amt,category:'Transfer',date,note});save('ledger');return done('Moved NPR '+num(amt),{label:'Undo',fn:()=>undoTx(id)});}
  const acct=Number(v('fAcct'));if(!acctById(acct))return err('Pick an account');
  const id=uid();S.d.ledger.push({id,type,acct,amount:amt,category:v('fCat')||'Other',date,note});
  S.month=ymOf(date);try{localStorage.setItem('fx_lastacct',acct);}catch(e){}
  save('ledger');done((type==='income'?'Income':'Expense')+' saved · '+acctName(acct),{label:'Undo',fn:()=>undoTx(id)});
}
function undoTx(id){S.d.ledger=S.d.ledger.filter(t=>t.id!==id);save('ledger');rerender();snapshot();toast('Removed');}
function txOpen(id){
  const t=S.d.ledger.find(x=>x.id===Number(id));if(!t)return;
  const isLoan=t.type==='loan';
  openSheet('Transaction',`<div class="bigamt">${txAmt(t)}</div>
   <div class="kv"><span>Type</span><b>${t.type==='transfer'?'Transfer':t.type==='loan'?'Lend / borrow':t.type[0].toUpperCase()+t.type.slice(1)}</b></div>
   <div class="kv"><span>${isLoan||t.type==='transfer'?'Details':'Category'}</span><b>${emoji(t.category)} ${esc(txTitle(t))}</b></div>
   <div class="kv"><span>Account</span><b>${t.type==='transfer'?esc(acctName(t.acct))+' → '+esc(acctName(t.to)):esc(acctName(txAcct(t)))}</b></div>

   ${isLoan?'<p class="note">Manage this under More → Lend &amp; borrow.</p>':''}`,
   isLoan?'':`<button class="btn danger" data-act="txDel" data-id="${t.id}">Delete</button>`);

async function txDel(id){
  const t=S.d.ledger.find(x=>x.id===Number(id));if(!t)return;

function loanNew(){const sel=S.d.accounts[0]&&S.d.accounts[0].id;
  openSheet('New lend / borrow',`<div class="seg"><button class="on" data-act="loanDir" data-v="lent">I gave money</button><button data-act="loanDir" data-v="borrowed">I took money</button></div><input type="hidden" id="lDir" value="lent"/>

   ${acctChips('Money moved in / out of','lAcct',sel)}<label for="lDate">Date</label><input type="date" id="lDate" value="${today()}"/><label for="lDue">Return by (optional)</label><input type="date" id="lDue"/><label for="lNote">Note (optional)</label><input id="lNote" maxlength="120"/>
   <label class="check"><input type="checkbox" id="lSkip"/> Old loan — already reflected in my balances (don’t change any account)</label><div class="err" id="shErr"></div>`,`<button class="btn" data-act="loanSave">Save</button>`);}
function loanSave(){const person=v('lPerson'),amt=parse(v('lAmt')),dir=v('lDir')==='borrowed'?'borrowed':'lent',skip=$('#lSkip').checked,acct=Number(v('lAcct'));

function pasteApply(){
  const lines=v('pasteBox').split(/\r?\n/),day=today(),upd=[],add=[],uc=[];
  lines.forEach(line=>{let c=line.split(/\t+/).map(s=>s.trim()).filter(Boolean);if(c.length<3)c=line.trim().split(/\s+/);
    const si=c.findIndex(x=>/^[A-Za-z][A-Za-z0-9]{1,11}$/.test(x)&&!/^(scrip|total|current|last|value|balance)$/i.test(x));if(si<0)return;

/* ═════════ PIN lock + fingerprint ═════════ */
const enc=new TextEncoder(),b64=a=>btoa(String.fromCharCode(...a)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256)));}
const pinCfg=()=>{try{return JSON.parse(localStorage.getItem('fx_pin')||'null');}catch(e){return null;}};
let entry='';
function lockShow(msg){S.locked=true;entry='';$('#lock').classList.add('show');$('#lockMsg').textContent=msg||'Your finance is locked';drawDots();
  const c=pinCfg();if(c&&c.bio)setTimeout(()=>bioUnlock(true),250);}
function drawDots(){const c=pinCfg(),n=c?c.len:4;$('#dots').innerHTML=Array.from({length:n},(_, i)=>`<i class="${i<entry.length?'f':''}"></i>`).join('');}
function buildPad(){const c=pinCfg();$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join('')+`<button class="ghost" data-act="${c&&c.bio?'bio':'noop'}" aria-label="Fingerprint">${c&&c.bio?ico('finger'):''}</button><button data-act="key" data-v="0">0</button><button class="ghost" data-act="keyDel" aria-label="Delete">⌫</button>`;}
async function keyPress(d){
  const c=pinCfg();if(!c)return;const until=+localStorage.getItem('fx_lockuntil')||0;
  if(Date.now()<until){$('#lockMsg').textContent='Too many tries — wait '+Math.ceil((until-Date.now())/1000)+'s';return;}
  if(entry.length>=c.len)return;entry+=d;buzz(5);drawDots();
  if(entry.length===c.len){
    const ok=(await pinHash(entry,unb64(c.salt)))===c.hash;
    if(ok){localStorage.removeItem('fx_fails');unlock();}
    else{const f=(+localStorage.getItem('fx_fails')||0)+1;localStorage.setItem('fx_fails',f);if(f>=5){localStorage.setItem('fx_lockuntil',Date.now()+30000);localStorage.setItem('fx_fails',0);$('#lockMsg').textContent='Too many tries — wait 30s';}else $('#lockMsg').textContent='Wrong PIN · '+(5-f)+' tries left';
      buzz([30,50,30]);$('#dots').classList.add('shake');setTimeout(()=>{$('#dots').classList.remove('shake');entry='';drawDots();},380);}
  }
}
function unlock(){S.locked=false;$('#lock').classList.remove('show');entry='';if(S.ready){render();if(S.pendingAdd){const t=S.pendingAdd;S.pendingAdd=null;openTxn(['income','move'].includes(t)?t:'expense');}}else initData();}
async function bioUnlock(auto){
  const c=pinCfg();if(!c||!c.bio||!navigator.credentials)return;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{id:unb64(c.bio),type:'public-key'}],userVerification:'required',timeout:60000}});unlock();}
  catch(e){if(!auto)$('#lockMsg').textContent='Fingerprint didn’t work — use your PIN';}
}
async function bioEnroll(){
  const rp={name:'My Finance',id:location.hostname},u=crypto.getRandomValues(new Uint8Array(16));
  const cred=await navigator.credentials.create({publicKey:{rp,user:{id:u,name:'owner',displayName:'Owner'},challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  return b64(new Uint8Array(cred.rawId));
}
function pinSheet(){
  const c=pinCfg();
  if(!c){openSheet('Set an app lock',`<p class="note" style="margin-top:6px">The app will ask for this PIN every time it opens or comes back after a short while. It protects against someone picking up your phone.${(!S.auth)?'<br/><b>You are on this-device-only mode: if you forget the PIN, the data on this phone is lost.</b>':''}</p><div class="lbl">Length</div><div class="chips"><button class="chip on" data-act="pick" data-input="pLen" data-v="4">4 digits</button><button class="chip" data-act="pick" data-input="pLen" data-v="6">6 digits</button></div><input type="hidden" id="pLen" value="4"/><label for="pin1">New PIN</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="6"/><label for="pin2">Repeat PIN</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="6"/><div class="err" id="shErr"></div>`,`<button class="btn" data-act="pinSave">Turn on app lock</button>`);}
  else openSheet('App lock',`<div class="kv"><span>App lock</span><b>On (${c.len} digits)</b></div><div class="kv"><span>Fingerprint unlock</span><b>${c.bio?'On':'Off'}</b></div><label for="pinCur">Enter your PIN to change settings</label><input id="pinCur" type="password" inputmode="numeric" maxlength="6" autocomplete="off"/><div class="err" id="shErr"></div>`,
   `<button class="btn" data-act="pinBio">${c.bio?'Turn off fingerprint':'Turn on fingerprint unlock'}</button><div class="btn-row"><button class="btn danger" data-act="pinOff">Remove app lock</button></div>`);
}
async function pinSave(){const len=Number(v('pLen'))||4,a=v('pin1'),b=v('pin2');if(!new RegExp('^\\d{'+len+'}$').test(a))return err('PIN must be exactly '+len+' digits');if(a!==b)return err('The two PINs don’t match');
  const salt=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem('fx_pin',JSON.stringify({salt:b64(salt),hash:await pinHash(a,salt),len}));closeSheet();toast('App lock is on');rerender();}
async function pinVerifyCur(){const c=pinCfg(),p=v('pinCur');if(!c||p.length!==c.len||(await pinHash(p,unb64(c.salt)))!==c.hash){err('Wrong PIN');return false;}return true;}
async function pinOff(){if(!await pinVerifyCur())return;localStorage.removeItem('fx_pin');closeSheet();toast('App lock removed');rerender();}
async function pinBio(){if(!await pinVerifyCur())return;const c=pinCfg();
  if(c.bio){delete c.bio;localStorage.setItem('fx_pin',JSON.stringify(c));closeSheet();toast('Fingerprint unlock off');return;}
  try{c.bio=await bioEnroll();localStorage.setItem('fx_pin',JSON.stringify(c));closeSheet();toast('Fingerprint unlock on');}catch(e){err('Couldn’t set up fingerprint on this device.');}}
async function forgotPin(){if(!await ask('Forgot your PIN?','This signs you out and clears the finance data on this phone. Sign in again to restore it from the cloud.','Reset',true))return;
  try{S.sb&&await S.sb.auth.signOut();}catch(e){}['fx_pin','fx_dirty','fx_localonly','fx_fails','fx_lockuntil'].forEach(k=>localStorage.removeItem(k));KEYS.forEach(k=>localStorage.removeItem('fx2_'+k));location.reload();}

/* ═════════ auth / boot ═════════ */
async function doSignIn(){
  const email=v('lgEmail'),pw=$('#lgPass').value,e=$('#lgErr');if(!email||!pw){e.textContent='Enter your email and password.';return;}
  if(!S.sb){e.textContent='Sign-in needs an internet connection the first time.';return;}
  e.textContent='Signing in…';
  try{const r=await S.sb.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error;$('#lgPass').value='';S.auth=true;S.email=email;S.localOnly=false;localStorage.removeItem('fx_localonly');
    $('#login').classList.remove('show');await pull();finishInit();toast('Signed in ✓');}
  catch(x){e.textContent='Sign-in failed: '+(x.message||'check your email and password');}
}
function useLocal(){S.localOnly=true;localStorage.setItem('fx_localonly','1');$('#login').classList.remove('show');setSync('local');finishInit();}
function finishInit(){seed();S.ready=true;snapshot();if(S.locked)return;routeFromHash();}
async function initData(){
  loadLocalSession();
  if(S.sb){
    try{const r=await S.sb.auth.getSession();S.auth=!!(r.data&&r.data.session);S.email=(r.data&&r.data.session&&r.data.session.user&&r.data.session.user.email)||'';}catch(e){S.auth=false;}
    S.sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'&&S.ready){S.auth=false;}});
  }
  if(S.auth){S.ready=true;render();pull().then(()=>{seed();snapshot();rerender();});S.ready=true;if(!S.locked)routeFromHash();return;}
  const haveLocal=KEYS.some(k=>meaningful(S.d[k]));
  if(S.localOnly||(haveLocal&&!S.sb)){setSync('local');finishInit();return;}
  if(haveLocal){setSync('pending');finishInit();$('#login').classList.add('show');return;} // has data but session expired: let them in, offer sign-in
  $('#login').classList.add('show');
}
function loadLocalSession(){}
function onClick(e){
  const r=e.target.closest('[data-route]');if(r){go(r.dataset.route);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,val=el.dataset.v;
  switch(a){
   case 'back':history.back();break;
   case 'add':buzz();openTxn('expense');break;
   case 'closeSheet':closeSheet();break;
   case 'toggleHide':toggleHide();break;
   case 'syncInfo':syncInfo();break;case 'syncNow':syncNow();break;case 'signOut':signOut();break;
   case 'showLogin':closeSheet(true);$('#login').classList.add('show');break;
   case 'signIn':doSignIn();break;case 'localOnly':useLocal();break;
   case 'pick':{const inp=$('#'+el.dataset.input);inp.value=val;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));buzz(4);break;}
   case 'pickCat':$('#fCat').value=val;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));buzz(4);break;
   case 'txType':{const d={amt:v('fAmt'),note:v('fNote'),date:v('fDate'),acct:Number(v('fAcct'))||undefined,to:Number(v('fTo'))||undefined};openTxn(val,d);break;}
   case 'txSave':saveTxn(el.dataset.type);break;case 'txOpen':txOpen(id);break;case 'txDel':txDel(id);break;
   case 'monthPrev':S.month=shiftYM(S.month,-1);rerender();break;case 'monthNext':S.month=shiftYM(S.month,1);rerender();break;
   case 'filter':S.filter=id||'';rerender();break;
   case 'acctGo':S.filter=id;S.month=today().slice(0,7);go('activity');break;
   case 'acctNew':acctNew();break;case 'acctSave':acctSave();break;case 'acctOpen':acctOpen(id);break;case 'acctSet':acctSet(id);break;case 'acctDel':acctDel(id);break;
   case 'acctView':S.filter=id;hideSheet();S.month=today().slice(0,7);go('activity');break;case 'moveOpen':moveOpen();break;
   case 'loanNew':loanNew();break;case 'loanSave':loanSave();break;case 'loanOpen':loanOpen(id);break;
   case 'loanDir':$('#lDir').value=val;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
   case 'repSave':repSave(id);break;case 'loanDel':loanDel(id);break;
   case 'repDel':S.d.ledger=S.d.ledger.filter(t=>t.id!==Number(id));save('ledger');rerender();loanOpen(el.dataset.loan);break;
   case 'writeOff':{const l=S.d.loans.find(x=>x.id===Number(id));ask('Write off '+l.person+'?','No account changes — it just stops counting.','Write off',true).then(ok=>{if(ok){l.writtenOff=true;save('loans');done('Written off');}});break;}
   case 'reopen':{const l=S.d.loans.find(x=>x.id===Number(id));l.writtenOff=false;save('loans');done('Reopened');break;}
   case 'goalNew':goalNew();break;case 'goalSave':goalSave();break;case 'goalOpen':goalOpen(id);break;case 'goalAdd':goalAdd(id);break;case 'goalDel':goalDel(id);break;
   case 'itemNew':itemNew();break;case 'itemSave':itemSave();break;case 'itemOpen':itemOpen(id);break;case 'itemUpd':itemUpd(id);break;case 'itemDel':itemDel(id);break;
   case 'itemKind':$('#iKind').value=val;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
   case 'holdNew':holdNew();break;case 'holdOpen':holdOpen(id);break;case 'holdSave':holdSave(id);break;case 'holdDel':holdDel(id);break;
   case 'paste':paste();break;case 'pasteApply':pasteApply();break;
   case 'sipOpen':sipOpen();break;case 'sipSave':sipSave();break;case 'sipRecord':sipRecord();break;
   case 'go-accounts':go('more/accounts');break;case 'go-loans':go('more/loans');break;case 'go-goals':go('more/goals');break;case 'go-items':go('more/items');break;
   case 'exportCsv':exportCsv();break;case 'backupJson':backupSheet();break;case 'backupSave':backupSave();break;case 'install':install();break;
   case 'pinSheet':pinSheet();break;case 'pinSave':pinSave();break;case 'pinOff':pinOff();break;case 'pinBio':pinBio();break;
   case 'key':keyPress(val);break;case 'keyDel':entry=entry.slice(0,-1);drawDots();break;case 'bio':bioUnlock(false);break;case 'forgotPin':forgotPin();break;
  }
}
function boot(){
  ['home','activity','invest','more'].forEach(t=>{$('#t-'+t).innerHTML=ico({home:'home',activity:'list',invest:'trend',more:'more'}[t])+`<span>${{home:'Home',activity:'Activity',invest:'Invest',more:'More'}[t]}</span>`;});
  $('.fab').innerHTML=ico('plus');
  document.addEventListener('click',onClick);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='lgPass')doSignIn();});
  window.addEventListener('hashchange',()=>{if(S.ready&&!S.locked)routeFromHash();});
  window.addEventListener('popstate',()=>{if(S.sheetOpen){hideSheet();return;}if(S.ready&&!S.locked)routeFromHash();});
  window.addEventListener('online',()=>flush());
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.route==='more')rerender();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)S.hiddenAt=Date.now();else{if(pinCfg()&&S.ready&&!S.locked&&Date.now()-S.hiddenAt>30000){closeSheet(true);lockShow();}else if(S.auth)flush();}});
  loadLocal();
  if(window.supabase){try{S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){}}
  $('#eyeBtn').innerHTML=ico(S.hide?'eyeoff':'eye');document.body.classList.toggle('hide',S.hide);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/finance-sw.js',{scope:'/finance.html'}).catch(()=>{}));
  buildPad();
  if(pinCfg())lockShow();else initData();
  if(pinCfg())initDataBackground();
}
function initDataBackground(){/* data loads after unlock */}
boot();
})();
